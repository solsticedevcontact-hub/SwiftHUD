name: Build SwiftHUD EXE

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build EXE
        run: >
          pyinstaller --noconfirm --onefile --windowed --uac-admin
          --name SwiftHUD --version-file version_info.txt
          --collect-all customtkinter --collect-all GPUtil --collect-all keyboard
          swifthud.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SwiftHUD-exe
          path: dist/SwiftHUD.exe